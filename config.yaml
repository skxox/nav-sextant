# nav-sextant 引导配置
#
# 本文件只保留「无法放在数据库里」的引导项（数据库路径）。
# 其余全部配置均在网页「设置」页维护，保存后写入数据库并即时生效：
#   - LLM（接口地址 / 模型 / API Key / 采样数 / 语义缓存 TTL）
#   - 策略参数与风控红线（权重 / 阈值 / 动量窗口 / 估值窗口）
#   - Bull/Bear 辩论、内置调度、告警推送（飞书 / 企微 / 邮件）、回测费率
#   - 自选基金（存 fund_config 表，支持增删改）
# 数据库中的覆盖项删除后回落到代码内置默认值。
database:
  path: "data/sextant.db"
